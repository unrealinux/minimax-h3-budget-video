name: Price Check

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check prices against live sources
        id: check
        run: |
          set +e
          python scripts/check_prices.py --report price-report.md --timeout 40 | tee output.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "::warning::有来源抓取或解析失败，需要人工看一下"
          elif [ "$code" = "1" ]; then
            echo "::warning::检测到价格变动"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-report
          path: |
            price-report.md
            output.txt
          if-no-files-found: ignore

      - name: Open or update issue
        if: steps.check.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const code = '${{ steps.check.outputs.code }}';
            const title = code === '1'
              ? '价格变动：prices.json 需要更新'
              : '价格核验失败：抓取或解析出错';
            const hint = code === '1'
              ? '确认无误后运行 `python scripts/check_prices.py --update`，提交并更新 CHANGELOG。'
              : '页面结构可能变了，需要修 `scripts/check_prices.py` 的解析逻辑。';
            const report = fs.readFileSync('price-report.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${report}\n\n${hint}\n\n[查看本次运行](${runUrl})`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已在 #${existing.number} 追加评论`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`已创建 #${created.number}`);
            }
